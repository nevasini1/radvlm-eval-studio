[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radvlm-eval-studio"
version = "0.1.0"
description = "GPU-light radiology VLM evaluation and clinician-review prototype (research demo only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RadVLM Eval Studio" }]
dependencies = [
    "streamlit>=1.30",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
vlm = ["mlx-vlm"]
clip = ["open_clip_torch", "torch"]

[tool.setuptools.packages.find]
include = ["radvlm_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
